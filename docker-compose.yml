services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/adhd_study.db
    volumes:
      - adhd_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  adhd_data:
